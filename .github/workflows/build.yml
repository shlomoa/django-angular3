name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install dev dependencies
      run: pip install -e ".[dev]"
    - name: Lint
      run: ruff check django_angular3 tests
    - name: Format check
      run: ruff format --check django_angular3 tests

  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[yaml]
        pip install build

    - name: Run tests
      run: python -m unittest discover -s tests -p 'test*.py'

    - name: Build package
      run: python -m build

  ngdj-contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Derive the pinned angular-django2 tag
      id: pin
      run: |
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import re
        import sys

        with open("django_angular3/django-angular3.json", encoding="utf-8") as handle:
            package = json.load(handle)["tool"]["ngAddPackage"]
        match = re.fullmatch(r"angular-django2@(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.+-]+)?)", package)
        if match is None:
            sys.exit(
                f"tool.ngAddPackage is {package!r}: expected a registry spec with a pinned "
                "version such as 'angular-django2@0.7.1', not a path or an unpinned name"
            )
        print(f"ref=v{match.group(1)}")
        PY
    - name: Check out angular-django2 at the pinned release
      uses: actions/checkout@v4
      with:
        repository: shlomoa/angular-django2
        ref: ${{ steps.pin.outputs.ref }}
        path: ngdj
        sparse-checkout: projects/angular-django2
        fetch-depth: 1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[yaml]
    - name: Run the ngdj contract and fixture-drift tests
      env:
        ANGULAR_DJANGO2_ROOT: ${{ github.workspace }}/ngdj
        DJNG_REQUIRE_NGDJ: "1"
      run: python -m unittest tests.test_ngdj_requirements tests.test_ngdj_command_mapping -v

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install docs dependencies
      run: pip install -e ".[docs]"
    - name: Build docs
      run: python -m sphinx docs docs/_build/html -W --keep-going
    - name: Test docs integration
      run: python -m unittest tests.test_docs
    - name: Test modal links
      run: node --test tests/modal_links.test.mjs
